<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엘케이학원 프리미엄 랜딩 프로그램 - Gothic Balanced</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* [DESIGN SYSTEM & RESET] */
        :root {
            --lk-blue: #1E3A8A;
            --lk-navy: #0F172A;
            --lk-accent-red: #A3493E;
            --text-dark: #1E293B;
            --text-light: #64748B;
            --bg-soft: #F8FAFC;
            --white: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #cbd5e1; 
            display: grid; 
            gap: 40px; 
            grid-template-columns: 1fr; 
            padding: 60px 0; 
            place-items: center; 
            font-family: 'Noto Sans KR', sans-serif;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: var(--white);
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }

        .slide-container::before {
            content: "SINCE 2014";
            position: absolute;
            top: 40px;
            right: 60px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--lk-blue);
            letter-spacing: 3px;
            opacity: 0.7;
        }

        /* [TYPOGRAPHY] */
        h1, h2, h3, h4 { color: var(--lk-navy); font-weight: 700; }
        
        .slide-title {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 40px;
            text-align: left;
            width: 100%;
            border-left: 12px solid var(--lk-blue);
            padding-left: 25px;
            letter-spacing: -1px;
        }

        .content-area { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; width: 100%; }
        
        p, li { 
            font-size: 20px; 
            line-height: 1.7; 
            color: var(--text-dark); 
            font-weight: 400;
            letter-spacing: -0.02em;
        }

        /* [LAYOUT COMPONENTS] */
        .hero-layout { text-align: center; }
        .hero-strike { text-decoration: line-through; text-decoration-color: var(--lk-accent-red); text-decoration-thickness: 3px; color: var(--text-light); font-size: 36px; margin-bottom: 12px; font-weight: 400; }
        
        .hero-main { 
            font-size: 72px; 
            color: var(--lk-navy); 
            margin-bottom: 35px; 
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1.2;
        }
        .hero-main span { color: var(--lk-blue); }

        .metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
        .metric-item { padding: 40px 20px; text-align: center; border-right: 1px solid #e2e8f0; }
        .metric-item:last-child { border-right: none; }
        .metric-val { font-family: 'Poppins', sans-serif; font-size: 64px; color: var(--lk-blue); font-weight: 700; margin-bottom: 10px; line-height: 1; }
        .metric-label { font-weight: 700; font-size: 22px; margin-bottom: 5px; }

        .two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; width: 100%; align-items: center; }
        .two-column-split { display: grid; grid-template-columns: 1fr 1fr; gap: 0; width: 100%; height: 100%; border: 1px solid #e2e8f0; }
        .split-pane { padding: 45px; height: 100%; }
        .split-pane:first-child { border-right: 1px solid #e2e8f0; }

        .image-wrapper { border-radius: 16px; overflow: hidden; height: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .image-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        .tiled-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; width: 100%; }
        .tile { background: var(--bg-soft); padding: 35px; border-radius: 12px; border-bottom: 5px solid #e2e8f0; }
        .tile h3 { font-size: 24px; color: var(--lk-blue); margin-bottom: 15px; font-weight: 700; }
        .tile-idx { font-family: 'Poppins', sans-serif; color: var(--text-light); font-size: 18px; margin-bottom: 10px; display: block; font-weight: 700; }

        /* [BALANCED CHART BOX (수정된 부분)] */
        .chart-box { 
            background: var(--lk-blue); 
            color: white; 
            border-radius: 20px; 
            padding: 50px 60px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
        }
        .chart-info { width: 70%; }
        .chart-info p { color: rgba(255,255,255,0.8); font-size: 22px; margin-bottom: 8px; }
        .chart-info h1 { color: white; font-size: 42px; font-weight: 700; line-height: 1.3; }
        
        /* 거대했던 150px ➔ 본문과 조화를 이루는 72px 콤팩트 크기로 축소 */
        .chart-score-container {
            display: flex;
            align-items: baseline;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 40px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .chart-val { 
            font-family: 'Poppins', sans-serif; 
            font-size: 72px; 
            font-weight: 800; 
            line-height: 1; 
            color: white;
        }
